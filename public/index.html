<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#fafbfb"/><title>Work Tracker</title><link rel="icon" href="/favicon.svg"/><link rel="stylesheet" href="/styles.css"/></head><body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"><img src="/favicon.svg" alt="Work Tracker logo" width="38" height="38"></span><div><strong>Work Tracker</strong><small>TEAM WORKSPACE</small></div></div>
    <nav id="nav" aria-label="Workspace navigation">
      <div class="nav-group"><div class="sidebar-label">DAILY WORKSPACE</div>
      <button data-view="dashboard" data-mobile-label="Home" class="nav-item active nav-primary" title="Dashboard" aria-label="Dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="nav-text">Dashboard</span></button>
      <button data-view="daily" data-mobile-label="Daily Work" class="nav-item nav-primary" title="Daily Work" aria-label="Daily Work"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16m-12 5 2 2 4-4"/></svg></span><span class="nav-text">Daily Work</span></button>
      </div>
      <div class="nav-group"><div class="sidebar-label">ENGINEERING</div>
      <button data-view="board" data-mobile-label="Engineering" class="nav-item nav-primary" title="Engineering Board" aria-label="Engineering Board"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16M5.5 8h1m5 0h1m5 0h1M5.5 12h1m5 0h1"/></svg></span><span class="nav-text">Engineering Board</span></button>
      <button data-view="releases" data-mobile-label="Versions" class="nav-item " title="Version Control" aria-label="Version Control"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v12a4 4 0 0 0 4 4h6M6 8h8a4 4 0 0 0 4-4"/><circle cx="6" cy="4" r="2"/><circle cx="18" cy="4" r="2"/><circle cx="18" cy="20" r="2"/></svg></span><span class="nav-text">Version Control</span></button>
      </div>
      <div class="nav-group" id="admin-nav" hidden><div class="sidebar-label">ADMINISTRATION</div>
      <button data-view="team" data-mobile-label="Team" class="nav-item " id="team-nav" hidden title="Team Access" aria-label="Team Access"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-16a3 3 0 0 1 0 6m3 10v-3a6 6 0 0 0-3-5"/></svg></span><span class="nav-text">Team Access</span></button>
      <button data-view="history" data-mobile-label="History" class="nav-item " id="history-nav" hidden title="Activity History" aria-label="Activity History"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 5v6h6m3-4v5l3 2"/></svg></span><span class="nav-text">Activity History</span></button>
      </div>
    </nav>
    <div class="sidebar-bottom"><div class="separation"></div><button id="login-entry" class="btn">Sign in</button><div class="profile" id="account-profile" hidden style="display:none"><button type="button" id="avatar" class="avatar" aria-label="My account" title="My account"></button><div class="profile-text"><strong id="current-user">—</strong><small id="current-role"></small><button id="change-password" class="account-link" aria-label="Change your password">Change password</button><button id="logout" class="account-link">Sign out</button></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><nav class="crumb" aria-label="Breadcrumb">Workspace <span aria-hidden="true">/</span> <span id="crumb" aria-current="page">Dashboard</span></nav><div class="topbar-tools"><div id="language-switch" hidden class="segmented language-switch" role="group" aria-label="Display language"><button type="button" data-language="zh" aria-pressed="false" disabled>中文</button><button type="button" data-language="en" class="selected" aria-pressed="true" disabled>English</button></div><div class="top-actions"><select id="demo-user" aria-label="Preview account" hidden><option value="boss@demo.local">Boss (preview)</option><option value="admin@demo.local">Admin (Admin preview)</option><option value="engineer@demo.local">Engineer (Engineer preview)</option></select><button class="icon-btn" id="usage-guide" aria-label="Usage guide" title="Usage guide"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5a2.7 2.7 0 0 1 5 1.4c0 2-2.5 2.1-2.5 4"/><path d="M12 17h.01"/></svg></button><button class="icon-btn mobile-account" id="account-menu" aria-label="Account menu" title="Account"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button></div></div></header>
    <div id="workspace-switch" class="workspace-mode-wrap" hidden><div class="segmented workspace-mode-control" role="group" aria-label="Workspace perspective"><button type="button" data-workspace-mode="personal" class="selected" aria-pressed="true">My work</button><button type="button" data-workspace-mode="team" aria-pressed="false">Team overview</button></div></div>
    <div class="content" id="content"><div class="loading"><span data-ui="Loading workspace…">Loading workspace…</span></div></div>
  </main>
</div>
<div id="panel-shade" class="panel-shade hidden" aria-hidden="true"></div>
<section class="detail-panel hidden" id="detail-panel" aria-label="Task details"><div id="detail-content"></div></section>
<div class="modal-shade hidden" id="modal-shade"><section class="modal" id="modal-content" role="dialog" aria-modal="true"></section></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/language.js"></script>
<script src="/app.js" type="module"></script></body></html>
