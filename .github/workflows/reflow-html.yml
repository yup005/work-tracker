name: One-time refactor final formatting

on:
  push:
    branches:
      - refactor/readable-html-templates
    paths:
      - .github/workflows/reflow-html.yml
      - scripts/reflow-html-templates.mjs

permissions:
  contents: write

jobs:
  reflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm ci --ignore-scripts
      - run: npm run format
      - run: npm run format:check
      - run: npm test
      - run: node scripts/build.mjs
      - run: node --check dist/server/index.js
      - run: git diff --check
      - name: Commit validated readability changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js scripts/build.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format readable helpers and build pipeline"
            git push origin HEAD:refactor/readable-html-templates
          fi
